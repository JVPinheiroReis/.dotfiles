# -----------------------------------------------------
# Window rules
# -----------------------------------------------------
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(QjackCtl)$ 


windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$

windowrule = float on, match:class ^(net.ankiweb.Anki)$ title:^(Add)$

windowrule = float on, match:class ^(qalculate-gtk)$ 

windowrule = float on, match:class ^(qalculate-qt)$ 

windowrule = float on, match:class ^(mpv)$
windowrule = match:class ^(mpv)$, max_size 480 270


# Smart borders and rounding
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = border_size 0, match:float 0, match:workspace f[1]s[false]

windowrule = rounding 3, match:float 1, match:workspace w[tv1]s[false]
